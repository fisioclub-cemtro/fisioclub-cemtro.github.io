<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fisioclub&amp;Sports · Clínica CEMTRO</title>
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fisioclub">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>:root{--bg:#050505;--card:#0e0e10;--card2:#141417;--ink:#f4f1f1;--mute:#8f8a8c;--faint:#5e5a5c;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);--gar:#c4435b;--garbg:#8e1f33;--garhi:#a8263d;--ok:#5cc497;--warn:#e3a25a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.6 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
.wrap{max-width:600px;margin:0 auto;padding:20px 16px 64px}
h1,h2,h3{font-family:Montserrat,Inter,sans-serif;color:var(--gar);margin:0;letter-spacing:-.01em}
h2{font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin:40px 0 14px}
h3{font-size:17px;font-weight:600;line-height:1.3}
.sub{color:var(--mute);margin:6px 0 0;font-size:14.5px}
.eyebrow{margin:0 0 10px;font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:4px 0 18px;margin-bottom:36px;border-bottom:1px solid var(--line)}
.topbar .btn.ghost{margin:0;font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.logo.sm{display:block;width:128px;height:auto;mix-blend-mode:screen;opacity:.92}
.hero{display:block;width:100%;height:auto;border-radius:18px;margin:4px 0 32px;border:1px solid var(--line);box-shadow:0 24px 60px -30px rgba(142,31,51,.55)}
.hello{font:300 34px/1.12 Montserrat,Inter,sans-serif;color:var(--ink);margin:0 0 10px;letter-spacing:-.02em}
.hello b{color:var(--gar);font-weight:600}
.date{margin:0 0 28px;color:var(--mute);font-size:15px}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:16px}
.ex p{margin:8px 0 0;color:var(--mute);font-size:15px;line-height:1.6}
.pill{display:inline-block;background:rgba(196,67,91,.1);color:#e6aab5;border-radius:99px;padding:5px 12px;font-size:12.5px;font-weight:600;margin-top:14px}
.done{border-color:rgba(92,196,151,.35)}
.done h3::after{content:"  ✓";color:var(--ok)}
label{display:block;font-size:12.5px;font-weight:500;color:var(--mute);margin:16px 0 6px}
select,input[type=text],input[type=number],input[type=password],input[type=date],input[type=email],input[type=tel],textarea{width:100%;font:15.5px Inter,sans-serif;padding:12px 14px;border:1px solid var(--line2);border-radius:10px;background:#09090a;color:var(--ink);transition:border-color .15s}
select:focus,input:focus,textarea:focus{border-color:var(--gar);outline:none}
textarea{min-height:80px;resize:vertical}
.row{display:flex;gap:12px}.row>*{flex:1;min-width:0}
input[type=date]{min-width:0;-webkit-appearance:none;appearance:none;min-height:46px}
.btn{border:0;background:var(--garbg);color:#fff;font:600 14.5px Inter,sans-serif;padding:13px 20px;border-radius:10px;cursor:pointer;margin-top:18px;transition:background .15s}
.btn:hover{background:var(--garhi)}
.card>.btn:not(.ghost){width:100%}
.btn.ghost{background:none;color:var(--mute);padding:6px 0;margin:12px 0 0;font-weight:500}
.btn.ghost:hover{color:var(--ink)}
a.btn{display:inline-flex;justify-content:center;text-decoration:none;flex:1}
.contact{display:flex;gap:10px}.contact .btn{margin-top:16px}.contact .btn+.btn{background:none;border:1px solid var(--line2)}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin:0 0 28px}
.tabs button{flex:1;border:0;background:none;color:var(--mute);font:600 13.5px Inter,sans-serif;padding:10px;border-radius:9px;cursor:pointer}
.tabs button.on{background:var(--card2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2)}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days label{margin:0;display:flex}
.days input{position:absolute;opacity:0}
.days span{width:38px;height:38px;display:grid;place-items:center;border:1px solid var(--line2);border-radius:50%;font-weight:600;font-size:13px;cursor:pointer;color:var(--mute)}
.days input:checked+span{background:var(--garbg);color:#fff;border-color:var(--garbg)}
:focus-visible{outline:2px solid var(--gar);outline-offset:3px}
.meter{height:4px;background:var(--line2);border-radius:9px;overflow:hidden;margin:12px 0 8px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--garbg),var(--gar));border-radius:9px}
.prog{margin:0 0 20px}.prog .meter{margin:0 0 10px}
.chk{display:flex;align-items:center;gap:12px;font:600 15.5px Inter,sans-serif;color:var(--ink);margin:16px 0 0;cursor:pointer}
.chk input{width:22px;height:22px;accent-color:var(--ok)}
.chk.top{border-top:1px solid var(--line);margin-top:22px;padding-top:20px}
input[type=range]{width:100%;accent-color:var(--gar)}
.opts{display:flex;gap:8px}
.opts button{flex:1;padding:10px;border:1px solid var(--line2);background:none;color:var(--mute);border-radius:10px;font:600 13.5px Inter,sans-serif;cursor:pointer}
.opts button.on{background:var(--garbg);border-color:var(--garbg);color:#fff}
.clip{display:block;width:100%;max-height:420px;border-radius:12px;margin-top:16px;background:#000}
a.vid{display:inline-block;margin-top:14px;color:var(--gar);font-weight:600;text-decoration:none}
.empty{color:var(--mute);text-align:center;padding:28px}
.code{margin:12px 0 0;color:var(--mute);font-size:14.5px}.code b{color:var(--ink);letter-spacing:.06em;font-weight:600}
.err{color:var(--gar);font-weight:600;font-size:14px;margin:10px 0 0}
.alert{border-color:rgba(196,67,91,.45);background:rgba(142,31,51,.12)}
.msg{border-left:2px solid var(--gar);border-radius:4px 16px 16px 4px}
.msg .eyebrow{color:var(--gar)}
.tip{margin:0 0 28px;color:var(--mute);font-size:14.5px}
.tip summary{cursor:pointer;color:var(--mute);font-weight:500;font-size:13.5px;text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:4px}
.tip p{margin:10px 0 0;padding:14px 16px;background:var(--card);border-radius:12px;border:1px solid var(--line)}
.safe{margin-top:40px;padding-top:20px;border-top:1px solid var(--line);color:var(--faint);font-size:13px;text-align:center}
.bars{display:flex;gap:6px;height:84px;margin-top:18px}
.bar{flex:1;background:rgba(255,255,255,.04);border-radius:6px;position:relative;display:flex;align-items:flex-end;overflow:hidden}
.bar i{display:block;width:100%;background:linear-gradient(180deg,var(--gar),var(--garbg))}
.bar span{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-size:11px;font-weight:600;color:var(--mute)}
.note{font-size:12px;color:var(--faint);margin-top:28px;text-align:center}

.logrow{padding:16px 0;border-top:1px solid var(--line)}
.logrow:first-of-type{margin-top:14px}
.lh{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.lh b{font-weight:600;font-size:15px}
.ld{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);min-width:52px}
.lc{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.eva,.tag{font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:99px;border:1px solid var(--line2);color:var(--mute)}
.eva.lo{color:var(--ok);border-color:rgba(92,196,151,.35)}
.eva.mid{color:var(--warn);border-color:rgba(227,162,90,.4)}
.eva.hi{color:#fff;background:var(--garbg);border-color:var(--garbg)}
.tag.ok{color:var(--ok);border-color:rgba(92,196,151,.35)}
.lq{margin:10px 0 0;color:var(--ink);font-size:14.5px;font-style:italic}
@media print{body{background:#fff}#app>*:not(.report){display:none!important}.wrap>.note{display:none}.report{border:0;background:none;color:#000}.report *{color:#000!important}}

.upl{display:inline-flex;margin-top:12px;width:auto!important;background:none;border:1px solid var(--line2);color:var(--ink)}
.upl:hover{background:rgba(255,255,255,.04)}
.upl input{display:none}
.split{display:flex;justify-content:space-between;gap:12px;margin-top:6px}
.arow{display:flex;flex-direction:column;padding:12px 0;border-top:1px solid var(--line);margin-top:12px}
.arow span{color:var(--mute);font-size:14px}
.okt{color:var(--ok);font-weight:600}
.hint{font-size:13px;color:var(--faint);text-align:center;margin:18px 0 0}
.btn:disabled{opacity:.55;cursor:wait}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#1b1b1e;color:var(--ink);border:1px solid var(--line2);padding:12px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;max-width:calc(100% - 32px);z-index:9}
#toast.show{opacity:1;transform:translate(-50%,0)}

.filters{display:flex;gap:10px;margin:0 0 14px}.filters>*{flex:1;min-width:0}
input[type=search]{width:100%;font:15.5px Inter,sans-serif;padding:12px 14px;border:1px solid var(--line2);border-radius:10px;background:#09090a;color:var(--ink)}
.vbtns{display:flex;align-items:center;gap:16px;flex-wrap:wrap}.vbtns .btn.ghost{margin:12px 0 0}
.upst{margin-top:12px;padding:12px 14px;border-radius:10px;background:rgba(142,31,51,.14);border:1px solid rgba(196,67,91,.35);font-size:14px;font-weight:600;color:var(--ink)}
.tag.vt{display:inline-block;margin-top:10px;font-size:12px}.tag.vt.on{color:var(--gar);border-color:rgba(196,67,91,.4)}
optgroup{color:var(--mute);font-style:normal}
.btn.mail{display:flex;justify-content:center;width:100%;text-decoration:none;background:none;border:1px solid var(--line2);margin-top:12px}
</style>
</head>

var U={role:null,err:'',busy:false,ftab:'pac',pid:null,step:'code',code:'',fmode:'in',up:{},lq:'',lcat:''};

function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function daysAgo(n){var d=new Date();d.setDate(d.getDate()-n);return d}
function today(){return iso(new Date())}
function fmtD(d){return new Date(d+'T00:00').toLocaleDateString('es-ES',{day:'numeric',month:'long'})}
function dow(d){return new Date(d+'T00:00').getDay()}
function chk(r){if(r&&r.error)throw r.error;return r?r.data:null}
function exById(id){return D.ex.filter(function(e){return e.id===id})[0]||{name:'(ejercicio eliminado)',description:''}}
function logOf(id,day){return D.logs.filter(function(l){return l.plan_item_id===id&&l.day===day})[0]}
function cur(){return D.patients.filter(function(p){return p.id===U.pid})[0]}
function emailFor(c){return 'paciente-'+c.toLowerCase()+'@example.com'}
function newCode(){var a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',r=crypto.getRandomValues(new Uint32Array(8)),s='';for(var i=0;i<8;i++){s+=a[r[i]%a.length];if(i===3)s+='-'}return s}
function patientLink(c){return location.origin+location.pathname+'?c='+encodeURIComponent(c)}
function msg(e){var m=(e&&(e.message||e.error_description))||String(e);
 if(/Invalid login credentials/i.test(m))return 'Contraseña incorrecta.';
 if(/already registered/i.test(m))return 'Esa cuenta ya existe. Inicia sesión.';
 if(/at least 6|Password should/i.test(m))return 'La contraseña debe tener al menos 6 caracteres.';
 if(/Failed to fetch|NetworkError/i.test(m))return 'Sin conexión. Revisa tu internet e inténtalo de nuevo.';
 if(/exceeded the maximum|too large|Payload/i.test(m))return 'El vídeo es demasiado grande (máximo 50 MB).';
 return m}
function toast(m){var t=$('toast');t.textContent=m;t.className='show';clearTimeout(toast.t);toast.t=setTimeout(function(){t.className=''},3500)}
async function run(fn,opt){try{await fn();U.err=''}catch(e){console.error(e);U.err=msg(e);if(!opt||!opt.quiet)toast(U.err)}}

/* ---------- arranque y sesión ---------- */
async function boot(){
 var q=new URLSearchParams(location.search).get('c');if(q)U.code=q.toUpperCase();
 if(READY){await run(async function(){var s=chk(await sb.auth.getSession()).session;if(s)await whoAmI()},{quiet:true})}
 render()}
async function whoAmI(){
 if(chk(await sb.rpc('is_staff'))){U.role='fisio';await loadFisio();return}
